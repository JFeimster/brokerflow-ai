name: Retry failed BrokerFlow CI jobs once

on:
  workflow_run:
    workflows: [BrokerFlow CI]
    types: [completed]

permissions:
  actions: write

concurrency:
  group: brokerflow-ci-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-failed-jobs:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Retry only failed jobs once
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            await github.rest.actions.reRunFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            core.notice(`Requested one retry of failed jobs for CI run ${run.id}; successful jobs were left intact.`);
