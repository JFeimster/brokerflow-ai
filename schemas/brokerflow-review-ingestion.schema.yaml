openapi: 3.1.0
info:
  title: BrokerFlow Protected Review Ingestion
  version: 1.0.0
  description: Creates a persisted human review in one explicitly configured organization. Requires server-only SUPABASE_URL, SUPABASE_SECRET_KEY, BROKERFLOW_INGEST_API_KEY, and BROKERFLOW_INGEST_ORGANIZATION_ID plus an Idempotency-Key. This API performs no borrower decision or external submission. See docs/pr26-live-review-queue.md for setup and curl verification.
servers:
  - url: https://brokerflow-ai.vercel.app
    description: Use only after the owner configures the protected integration.
paths:
  /api/ingest/lender-match-review:
    post:
      operationId: createPersistedLenderMatchReview
      summary: Create a durable human review request
      security:
        - IntegrationBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtectedReviewRequest"
            example:
              action_type: lender_match_review
              requester_name: Broker intake
              borrower_type: business
              business_name: Example Business
              loan_purpose: equipment_financing
              requested_amount: 185000
              state: NY
              human_review_required: true
      responses:
        "201":
          description: Review and creation event committed atomically.
          content:
            application/json:
              schema:
                type: object
                required: [success, review_request_id, status, next_step, persisted]
                properties:
                  success: { const: true }
                  review_request_id: { type: string }
                  status: { const: queued_for_human_review }
                  next_step: { const: manual_review }
                  persisted: { const: true }
              example: { success: true, review_request_id: "lmr_opaque-reference", status: queued_for_human_review, next_step: manual_review, persisted: true }
        "401": { description: Missing or invalid integration credential. }
        "409": { description: Idempotency key reused with different content. }
        "503": { description: Owner setup or persistence service unavailable. }
components:
  schemas:
    ProtectedReviewRequest:
      type: object
      additionalProperties: false
      required: [action_type, requester_name, borrower_type, loan_purpose, requested_amount, state, human_review_required]
      properties:
        action_type: { const: lender_match_review }
        requester_name: { type: string, minLength: 1, maxLength: 200 }
        borrower_type:
          type: string
          enum: [individual, business, real_estate_investor, commercial_borrower, referral_partner_lead, unknown]
        business_name: { type: string, maxLength: 160 }
        loan_purpose:
          type: string
          enum: [business_working_capital, equipment_financing, commercial_real_estate, residential_purchase, residential_refinance, debt_consolidation, bridge_loan, construction, invoice_financing, sba_review, personal_loan, other]
        requested_amount: { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
        state: { type: string, minLength: 1, maxLength: 200 }
        human_review_required: { const: true }
        credit_score_range:
          type: string
          enum: [unknown, below_580, "580_619", "620_659", "660_699", "700_739", 740_plus]
        monthly_revenue: { type: number, minimum: 0 }
        annual_revenue: { type: number, minimum: 0 }
        time_in_business_months: { type: integer, minimum: 0 }
        urgency: { type: string, enum: [low, normal, high, same_day], default: normal }
        recommended_review_path:
          type: string
          enum: [business_funding_review, commercial_real_estate_review, residential_mortgage_review, equipment_financing_review, sba_or_bank_review, manual_exception_review, insufficient_information]
        employment_type:
          type: string
          enum: [employed, self_employed, business_owner, investor, retired, unemployed, unknown, other]
        property_type:
          type: string
          enum: [single_family, multifamily, condo, townhouse, mixed_use, commercial, land, construction, not_applicable, unknown, other]
        occupancy_type:
          type: string
          enum: [primary_residence, second_home, investment_property, owner_occupied_business, tenant_occupied, vacant, not_applicable, unknown]
        collateral_available: { type: boolean }
        notes: { type: string, maxLength: 4000, description: "Do not include direct personal identifiers or sensitive borrower records." }
  securitySchemes:
    IntegrationBearer:
      type: http
      scheme: bearer
