openapi: 3.1.0
info:
  title: BrokerFlow Partner Resource Folder API
  version: 1.0.0
servers:
  - url: https://brokerflow-ai.vercel.app/api/drive
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://YOUR-OAUTH-PROVIDER.com/oauth/authorize
          tokenUrl: https://YOUR-OAUTH-PROVIDER.com/oauth/token
          scopes:
            drive.file: Create and manage files created by this app.
  schemas:
    ResourceFolderRequest:
      type: object
      properties:
        partner_id: { type: string }
        folder_name: { type: string }
        assets:
          type: array
          items:
            type: string
            enum: [referral_rules, approved_email_templates, funding_readiness_scorecard_link, tracking_link, faq, onboarding_checklist]
        access:
          type: object
          properties:
            partner_email: { type: string, format: email }
            permission: { type: string, enum: [viewer, commenter, editor] }
      required: [partner_id, folder_name]
    ResourceFolderResponse:
      type: object
      additionalProperties: true
      properties:
        status: { type: string, enum: [accepted, processed, queued] }
        message: { type: string }
        folder_id: { type: string }
        folder_url: { type: string }
      required: [status, message]
security:
  - oauth2: [drive.file]
paths:
  /partner-resource-folder:
    post:
      operationId: createPartnerResourceFolder
      summary: Create a partner resource folder
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceFolderRequest'
      responses:
        '200':
          description: Folder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceFolderResponse'
  /partner-resource-folder/{folder_id}/asset:
    post:
      operationId: addPartnerResourceAsset
      summary: Add an asset reference to a partner resource folder
      x-openai-isConsequential: true
      parameters:
        - name: folder_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                asset_type: { type: string }
                asset_url: { type: string }
                notes: { type: string }
              required: [asset_type]
      responses:
        '200':
          description: Asset added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceFolderResponse'
  /partner-resource-folder/{folder_id}:
    get:
      operationId: getPartnerResourceFolder
      summary: Get partner resource folder details
      parameters:
        - name: folder_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Folder details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceFolderResponse'
x-brokerflow:
  auth_type: oauth_authorization_code
  rate_limit: Provider rate limits apply
