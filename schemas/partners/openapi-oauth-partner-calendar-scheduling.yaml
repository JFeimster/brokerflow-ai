openapi: 3.1.0
info:
  title: BrokerFlow Partner Calendar Scheduling API
  version: 1.0.0
servers:
  - url: https://brokerflow-ai.vercel.app/api/calendar
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://YOUR-OAUTH-PROVIDER.com/oauth/authorize
          tokenUrl: https://YOUR-OAUTH-PROVIDER.com/oauth/token
          scopes:
            calendar.events: Create and read calendar events.
  schemas:
    PartnerMeetingRequest:
      type: object
      properties:
        partner_id: { type: string }
        partner_name: { type: string }
        contact_name: { type: string }
        contact_email: { type: string, format: email }
        meeting_type:
          type: string
          enum: [partner_discovery_call, partner_onboarding_call, referral_review_call, monthly_partner_review]
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        description: { type: string }
      required: [contact_email, meeting_type, start_time, end_time]
    CalendarResponse:
      type: object
      additionalProperties: true
      properties:
        status: { type: string, enum: [accepted, processed, queued] }
        message: { type: string }
        event_id: { type: string }
        event_url: { type: string }
      required: [status, message]
security:
  - oauth2: [calendar.events]
paths:
  /availability:
    get:
      operationId: getPartnerMeetingAvailability
      summary: Get calendar availability for partner meeting scheduling
      parameters:
        - name: start_date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: end_date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Availability returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /partner-discovery-call:
    post:
      operationId: schedulePartnerDiscoveryCall
      summary: Schedule a partner discovery call
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerMeetingRequest'
      responses:
        '200':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
  /partner-onboarding-call:
    post:
      operationId: schedulePartnerOnboardingCall
      summary: Schedule a partner onboarding call
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerMeetingRequest'
      responses:
        '200':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
x-brokerflow:
  auth_type: oauth_authorization_code
  rate_limit: Provider rate limits apply
